# @package _global_
# Qualitative R2-v1 comparison on shared hydrant eval frames.
defaults:
  - /hydra_defaults
  - _self_

split: r3-4cat          # supplies the columns' images and train-time batches
probe_split: hydrant-full   # the probe arms' eval set (a subset of `split`)
probe_cache: r2v1_probe_320 # subdir of feats.root
size: 320
device: cuda
n_cols: 6
out_dir: r3
out_name: fig_r2v1_qualitative.png
title: R2-v1 reconstructions on shared held-out hydrant frames (rows 1/3 train-time decoders, row 2 post-hoc probe)

# kind: traintime -> the run's own co-trained decoder
# kind: probe     -> post-hoc R1 probe decoder (EMA) on that arm's mv tokens
# headline: metrics json whose psnr goes in the row label
rows:
  - label: "joint\n(train-time decoder)"
    kind: traintime
    run: r2_v1
    arm: joint
    step: 12000
    headline: r2_v1/joint/recon_eval.json
    headline_key: [A, psnr]
  - label: "match probe\n(matching only)"
    kind: probe
    run: r2_v1_probe
    arm: match
    headline: r2_v1_probe/match/metrics.json
    headline_key: [psnr]
  - label: "desc-recon RAE\n(frozen DINOv3)"
    kind: traintime
    run: r2_v1_desc
    arm: recon
    step: 12000
    desc_only: true
    skip_head: true
    headline: r2_v1_desc/recon/recon_eval.json
    headline_key: [A, psnr]
