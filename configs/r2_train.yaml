# R2/R3 training: RoMaV2 Matcher with a joint matching + reconstruction
# objective (docs/R2.md, docs/R3.md).
#
# Defaults below are the R2 v0 pilot recipe; a run is selected with
#   experiment=<name> arm=<match|joint|recon>
# and nothing else, so the config file *is* the description of the run.
defaults:
  - hydra_defaults
  - _self_
  # last, so the experiment's values win over the defaults below
  - experiment: r2_v0

arm: ???            # match | joint | recon
run: ???            # results/<run>/<arm>/ — set by the experiment
out_dir: null       # results-root override (smoke runs)
split: hydrant-full
size: 320           # input resolution; grids are size/16 and size/4
seed: 0
device: cuda

data:
  desc_cache: null  # null -> paths.yaml feats.desc
  num_workers: 4
  # dataset filters (docs/co3d_depth_issues.md): pose-quality floor for train
  # sequences and a pair covisibility floor (tokens on the /16 grid, best
  # direction) from the r2_pair_covis.py census
  vq_min: 0.5
  covis_floor: 8

model:
  init: scratch     # scratch | pretrained (romav2.pt matcher weights, R3)
  # frozen-DINOv3 control: linear 2048->1024 glue instead of the mv_vit, so
  # only the projection + heads (+ decoder) train
  desc_baseline: false
  decoder_size: B   # RAEDecoder on the mv tokens

optim:
  steps: 6000
  batch: 4          # 6 OOMs on 11 GB in the joint arm (fp32 DPT head + LPIPS peak)
  accum: 1          # gradient-accumulation micro-batches per optimizer step
  lr: 2.0e-4
  matcher_lr: null  # null -> lr; lower it when fine-tuning (R3)
  min_lr_ratio: 0.1
  warmup: 300
  wd_matcher: 0.05
  grad_clip: 1.0

loss:
  w_attn: 1.0
  w_warp: 5.0
  w_conf: 1.0
  lam_rec: 1.0      # recon weight; forced to 0 on the match arm
  lpips_w: 1.0

gan:
  # arms that run the train-time GAN (RAE stage-1 pieces on the recon).
  # Phase starts are fractions of the run, delayed past 1/2 vs RAE's 6/16
  # and 8/16 — the v0 pilot skipped the train-time GAN entirely for stability.
  arms: []
  disc_w: 0.75
  max_d_weight: 1.0e4
  disc_start_frac: 0.5
  gan_start_frac: 0.625

log:
  every: 50
  ckpt_every: 500
  eval_every: 1000
  eval_pairs: 40    # held-out pairs in the periodic eval (final eval: all)
